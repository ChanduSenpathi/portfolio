<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e20"/>
      <stop offset="50%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Monogram CS Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Tech Grid Accent -->
  <path d="M12 24h40M12 40h40M24 12v40M40 12v40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Code Tag Accents `<` and `>` -->
  <!-- Left `<` bracket -->
  <path d="M16 26 L9 32 L16 38" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Right `>` bracket -->
  <path d="M48 26 L55 32 L48 38" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- CS Monogram Centerpiece -->
  <text x="32" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">CS</text>

  <!-- Glowing Top-Right Status Pulse -->
  <circle cx="51" cy="13" r="3.5" fill="#10b981" stroke="#070914" stroke-width="1.5"/>
</svg>